spring.application.name=taskflow
server.port=8081

# PostgreSQL Configuration (Strictly reads from system/container environment)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Key and Expiration
jwt.secret=${JWT_SECRET:6g6y34bh734b8e774nnjjjdhjogneng40g40nf04vn04g}
jwt.expiration=${JWT_EXPIRATION:86400000}